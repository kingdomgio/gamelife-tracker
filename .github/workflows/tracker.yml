name: GameLife Tracker

# La lettura del catalogo gamelife.it la fa l'estensione Chrome sul computer: carica qui i dati
# e avvia questo lavoro in modalità "alerts" per controllare i prezzi obiettivo e mandare le notifiche.
on:
  # una volta al giorno (circa 20:37 ora italiana): avvisa se il computer non invia dati da oltre un giorno
  schedule:
    - cron: '37 19 * * *'
  # avvio da estensione e dashboard: "alerts" (avvisi), "test" (notifica di prova), "watchdog"
  workflow_dispatch:
    inputs:
      mode:
        description: 'alerts, test oppure watchdog'
        required: false
        default: 'alerts'
      id:
        description: 'ID del titolo (solo per alerts)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: gamelife-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      EMAIL: ${{ secrets.EMAIL }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_KEY: ${{ secrets.WHATSAPP_KEY }}
      MODE: ${{ github.event.inputs.mode || 'watchdog' }}
      ALERT_ID: ${{ github.event.inputs.id || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Avvisi e notifiche
        run: |
          if [ -n "$ALERT_ID" ]; then node scraper/check.js "$MODE" "--id=$ALERT_ID"; else node scraper/check.js "$MODE"; fi

      - name: Salva il registro delle notifiche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Niente di nuovo da salvare."; exit 0; fi
          git commit -q -m "Notifiche $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Mantieni attivo il controllo programmato
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/tracker.yml/enable" --silent
