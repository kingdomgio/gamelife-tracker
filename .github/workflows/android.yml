name: App Android

# Crea l'app Android (APK) e la pubblica nella release "app" del repository.
# Parte da sola quando cambia la dashboard o l'app, oppure a mano da Actions → App Android → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'app.css'
      - 'app.js'
      - 'gh.js'
      - 'theme.js'
      - 'splash.js'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'vendor/**'
      - 'app/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chiave di firma
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::Segreto ANDROID_KEYSTORE mancante: l'app viene firmata con una chiave temporanea e gli aggiornamenti richiederanno di disinstallarla."
          else
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KS_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Prepara il progetto
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node prepare-web.js
          npx cap sync android

      - name: Compila l'APK
        working-directory: app/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: gamelife
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_FILE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/GameLife-Tracker.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GameLife-Tracker.apk"
          fi

      - name: Pubblica l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="App Android di GameLife Tracker PS5. Dal telefono scarica GameLife-Tracker.apk e aprilo per installarla o aggiornarla. Versione 1.0.${{ github.run_number }}."
          if ! gh release view app >/dev/null 2>&1; then
            gh release create app --title "App Android" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          else
            gh release edit app --notes "$NOTES"
          fi
          gh release upload app GameLife-Tracker.apk --clobber
          echo "### App pronta: https://github.com/${GITHUB_REPOSITORY}/releases/download/app/GameLife-Tracker.apk" >> "$GITHUB_STEP_SUMMARY"
